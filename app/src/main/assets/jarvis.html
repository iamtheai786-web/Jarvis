<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarvis AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0 10px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }
        .header-title { text-align: left; }
        .title { font-size: 18px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px #00f3ff; }
        .status { font-size: 10px; color: #70a1ff; letter-spacing: 1px; }

        .header-actions { display: flex; gap: 8px; }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-update-active {
            background: #00ff66 !important;
            color: #050b14 !important;
            border-color: #00ff66 !important;
            box-shadow: 0 0 15px #00ff66 !important;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
            50% { transform: scale(1.05); box-shadow: 0 0 20px #00ff66; }
            100% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
        }

        .orb-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 0;
        }
        .orb-container {
            position: relative;
            width: 65px; height: 65px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { width: 100%; height: 100%; border-top: 2px solid #00f3ff; border-bottom: 2px solid #00f3ff; animation: spin 4s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border-left: 2px solid #70a1ff; border-right: 2px solid #70a1ff; animation: spin-reverse 2.5s linear infinite; }
        .core {
            width: 50%; height: 50%;
            background: radial-gradient(circle, #00f3ff 0%, #050b14 70%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00f3ff;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        .display-box {
            flex: 1;
            width: 100%;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px; padding: 15px; overflow-y: auto;
            backdrop-filter: blur(5px); box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
            margin: 8px 0;
        }
        .message { margin-bottom: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .jarvis-msg { color: #00f3ff; }
        .user-msg { color: #eccc68; text-align: right; }

        .controls { width: 100%; display: flex; gap: 8px; }
        input {
            flex: 1; background: rgba(10, 25, 47, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 20px;
            padding: 12px 18px; color: #fff; outline: none; font-size: 14px;
        }
        button.send-btn {
            background: #00f3ff; border: none; border-radius: 20px;
            padding: 12px 20px; color: #050b14; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <div class="title">JARVIS AI</div>
            <div class="status" id="statusText">SYSTEM ONLINE // READY</div>
        </div>
        <div class="header-actions">
            <button class="btn" id="updateBtn" onclick="handleUpdateClick()">UPDATE</button>
            <button class="btn" onclick="setApiKey()">🔑 KEY</button>
        </div>
    </div>

    <div class="orb-wrapper">
        <div class="orb-container" onclick="startVoice()">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="core"></div>
        </div>
    </div>

    <div class="display-box" id="chatDisplay">
        <div class="message jarvis-msg"><b>JARVIS:</b> Welcome Boss! Tap '🔑 KEY' to enter your API key, then ask me anything.</div>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Ask Jarvis anything..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendText()">SEND</button>
    </div>

    <script>
        const CURRENT_VERSION = 2;
        const RAW_VERSION_URL = "/main/version.json";
        let updateDownloadUrl = "";

        const chatDisplay = document.getElementById('chatDisplay');
        const statusText = document.getElementById('statusText');
        const updateBtn = document.getElementById('updateBtn');

        async function checkAppUpdate() {
            try {
                const res = await fetch(RAW_VERSION_URL + '?t=' + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    if (data.version > CURRENT_VERSION) {
                        updateDownloadUrl = data.downloadUrl || "";
                        updateBtn.innerText = "UPDATE AVAILABLE 🚀";
                        updateBtn.classList.add("btn-update-active");
                    }
                }
            } catch (err) {
                console.log("Update check skipped.");
            }
        }

        function handleUpdateClick() {
            if (updateBtn.classList.contains("btn-update-active")) {
                if (window.Android && window.Android.openUrl) {
                    window.Android.openUrl(updateDownloadUrl);
                } else {
                    window.open(updateDownloadUrl, '_blank');
                }
            } else {
                alert("Your Jarvis App is up to date (v" + CURRENT_VERSION + ").");
            }
        }

        function setApiKey() {
            const currentKey = localStorage.getItem('gemini_api_key') || '';
            const key = prompt("Enter your Gemini API Key:", currentKey);
            if (key !== null && key.trim() !== "") {
                localStorage.setItem('gemini_api_key', key.trim());
                alert("API Key permanently saved!");
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(sender, text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-msg' : 'jarvis-msg');
            msg.innerHTML = ;
            chatDisplay.appendChild(msg);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;

            if (!isUser) speak(text);
        }

        async function fetchGeminiResponse(promptText) {
            const apiKey = localStorage.getItem('gemini_api_key') || '';
            if (!apiKey) {
                return "Boss, please tap the '🔑 KEY' button at top right to enter your Gemini API key.";
            }

            statusText.innerText = "THINKING...";
            const models = ['gemini-3.6-flash', 'gemini-3.1-pro-preview'];
            let lastError = "";

            for (let model of models) {
                try {
                    const url = ;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: "You are JARVIS, an intelligent AI assistant. Answer Boss directly and concisely. Question: " + promptText }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        statusText.innerText = "SYSTEM ONLINE // READY";
                        return data.candidates[0].content.parts[0].text;
                    }

                    if (data.error && data.error.message) {
                        lastError = data.error.message;
                    }
                } catch (err) {
                    lastError = "Network connection failed. Please check internet.";
                }
            }

            statusText.innerText = "SYSTEM ONLINE // READY";
            return "API Error: " + (lastError || "Service unavailable.");
        }

        async function processCommand(text) {
            const query = text.toLowerCase();

            if (query.includes('torch') || query.includes('flashlight') || query.includes('light')) {
                if (query.includes('on') || query.includes('open') || query.includes('start')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(true) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned ON, Boss." : "Turning ON Flashlight, Boss.");
                    return;
                } else if (query.includes('off') || query.includes('close') || query.includes('stop')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(false) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned OFF, Boss." : "Turning OFF Flashlight, Boss.");
                    return;
                }
            } else if (query.includes('battery')) {
                let level = window.Android && window.Android.getBatteryLevel ? window.Android.getBatteryLevel() : -1;
                addMessage('JARVIS', level >= 0 ?  : "Battery level checked.");
                return;
            } else if (query.startsWith('open ')) {
                let app = query.replace('open', '').trim();
                let launched = window.Android && window.Android.openApp ? window.Android.openApp(app) : false;
                addMessage('JARVIS', launched ?  : );
                return;
            }

            const aiResponse = await fetchGeminiResponse(text);
            addMessage('JARVIS', aiResponse);
        }

        async function sendText() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val) {
                addMessage('YOU', val, true);
                input.value = '';
                await processCommand(val);
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice Recognition not supported.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            statusText.innerText = "LISTENING...";
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                statusText.innerText = "SYSTEM ONLINE // READY";
                addMessage('YOU', text, true);
                processCommand(text);
            };
            
            recognition.onerror = function() { statusText.innerText = "SYSTEM ONLINE // READY"; };
            recognition.start();
        }

        checkAppUpdate();
    </script>
</body>
</html>
