<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarvis AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0 10px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }
        .header-title { text-align: left; }
        .title { font-size: 18px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px #00f3ff; }
        .status { font-size: 10px; color: #70a1ff; letter-spacing: 1px; }

        .header-actions { display: flex; gap: 8px; }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* Green glow style for update ready state */
        .btn-update-active {
            background: #00ff66 !important;
            color: #050b14 !important;
            border-color: #00ff66 !important;
            box-shadow: 0 0 15px #00ff66 !important;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
            50% { transform: scale(1.05); box-shadow: 0 0 20px #00ff66; }
            100% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
        }

        /* Compact Orb Layout to save screen space */
        .orb-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 0;
        }
        .orb-container {
            position: relative;
            width: 65px; height: 65px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { width: 100%; height: 100%; border-top: 2px solid #00f3ff; border-bottom: 2px solid #00f3ff; animation: spin 4s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border-left: 2px solid #70a1ff; border-right: 2px solid #70a1ff; animation: spin-reverse 2.5s linear infinite; }
        .core {
            width: 50%; height: 50%;
            background: radial-gradient(circle, #00f3ff 0%, #050b14 70%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00f3ff;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        /* FULL SCREEN EXPANDED CHAT DISPLAY */
        .display-box {
            flex: 1; /* Takes up all available screen height */
            width: 100%;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px; padding: 15px; overflow-y: auto;
            backdrop-filter: blur(5px); box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
            margin: 8px 0;
        }
        .message { margin-bottom: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .jarvis-msg { color: #00f3ff; }
        .user-msg { color: #eccc68; text-align: right; }

        .controls { width: 100%; display: flex; gap: 8px; }
        input {
            flex: 1; background: rgba(10, 25, 47, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 20px;
            padding: 12px 18px; color: #fff; outline: none; font-size: 14px;
        }
        button.send-btn {
            background: #00f3ff; border: none; border-radius: 20px;
            padding: 12px 20px; color: #050b14; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <div class="title">JARVIS AI</div>
            <div class="status" id="statusText">SYSTEM ONLINE // READY</div>
        </div>
        <div class="header-actions">
            <button class="btn" id="updateBtn" onclick="handleUpdateClick()">UPDATE</button>
            <button class="btn" onclick="setApiKey()">🔑 KEY</button>
        </div>
    </div>

    <div class="orb-wrapper">
        <div class="orb-container" onclick="startVoice()">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="core"></div>
        </div>
    </div>

    <div class="display-box" id="chatDisplay">
        <div class="message jarvis-msg"><b>JARVIS:</b> System initialized, Boss. Full screen interface & Auto-update system active. How can I help you today?</div>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Ask Jarvis anything..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendText()">SEND</button>
    </div>

    <script>
        const CURRENT_VERSION = 1;
        const RAW_VERSION_URL = "/main/version.json";
        let updateDownloadUrl = "";

        const chatDisplay = document.getElementById('chatDisplay');
        const statusText = document.getElementById('statusText');
        const updateBtn = document.getElementById('updateBtn');

        // Check for App Updates from GitHub
        async function checkAppUpdate() {
            try {
                const res = await fetch(RAW_VERSION_URL + '?t=' + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    if (data.version > CURRENT_VERSION) {
                        updateDownloadUrl = data.downloadUrl || "";
                        updateBtn.innerText = "UPDATE AVAILABLE 🚀";
                        updateBtn.classList.add("btn-update-active");
                    }
                }
            } catch (err) {
                console.log("Update check skipped.");
            }
        }

        function handleUpdateClick() {
            if (updateBtn.classList.contains("btn-update-active")) {
                if (window.Android && window.Android.openUrl) {
                    window.Android.openUrl(updateDownloadUrl);
                } else {
                    window.open(updateDownloadUrl, '_blank');
                }
            } else {
                alert("Your Jarvis App is already on the latest version (v" + CURRENT_VERSION + ").");
            }
        }

        // Get and Save API Key permanently
        function getSavedApiKey() {
            let key = "";
            if (window.Android && window.Android.getApiKey) {
                key = window.Android.getApiKey();
            }
            if (!key) {
                key = localStorage.getItem('gemini_api_key') || '';
            }
            return key;
        }

        function setApiKey() {
            const currentKey = getSavedApiKey();
            const key = prompt("Enter your Gemini API Key:", currentKey);
            if (key !== null) {
                const cleanKey = key.trim();
                localStorage.setItem('gemini_api_key', cleanKey);
                if (window.Android && window.Android.saveApiKey) {
                    window.Android.saveApiKey(cleanKey);
                }
                alert("API Key permanently saved!");
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(sender, text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-msg' : 'jarvis-msg');
            msg.innerHTML = ;
            chatDisplay.appendChild(msg);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;

            if (!isUser) speak(text);
        }

        function sendText() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val) {
                addMessage('YOU', val, true);
                input.value = '';
                addMessage('JARVIS', "I am currently undergoing interface updates, Boss. My responses will be fully configured shortly.");
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice Recognition not supported.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            statusText.innerText = "LISTENING...";
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                statusText.innerText = "SYSTEM ONLINE // READY";
                addMessage('YOU', text, true);
                sendText();
            };
            
            recognition.onerror = function() { statusText.innerText = "SYSTEM ONLINE // READY"; };
            recognition.start();
        }

        // Run auto check on launch
        checkAppUpdate();
    </script>
</body>
</html>
