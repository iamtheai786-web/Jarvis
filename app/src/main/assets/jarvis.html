<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarvis AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .header-title { text-align: center; flex: 1; }
        .title { font-size: 20px; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 10px #00f3ff; }
        .status { font-size: 11px; color: #70a1ff; letter-spacing: 1px; margin-top: 2px; }
        .key-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .orb-container {
            position: relative;
            width: 170px; height: 170px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { width: 100%; height: 100%; border-top: 2px solid #00f3ff; border-bottom: 2px solid #00f3ff; animation: spin 4s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border-left: 2px solid #70a1ff; border-right: 2px solid #70a1ff; animation: spin-reverse 2.5s linear infinite; }
        .core {
            width: 50%; height: 50%;
            background: radial-gradient(circle, #00f3ff 0%, #050b14 70%);
            border-radius: 50%;
            box-shadow: 0 0 30px #00f3ff, inset 0 0 15px #00f3ff;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        .display-box {
            width: 100%; max-width: 400px; height: 180px;
            background: rgba(10, 25, 47, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px; padding: 15px; overflow-y: auto;
            backdrop-filter: blur(5px); box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .message { margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        .jarvis-msg { color: #00f3ff; }
        .user-msg { color: #eccc68; text-align: right; }

        .controls { width: 100%; max-width: 400px; display: flex; gap: 10px; margin-bottom: 10px; }
        input {
            flex: 1; background: rgba(10, 25, 47, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 20px;
            padding: 12px 18px; color: #fff; outline: none; font-size: 14px;
        }
        button {
            background: #00f3ff; border: none; border-radius: 20px;
            padding: 12px 20px; color: #050b14; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <div class="title">JARVIS AI</div>
            <div class="status" id="statusText">SYSTEM ONLINE // READY</div>
        </div>
        <button class="key-btn" onclick="setApiKey()">🔑 API KEY</button>
    </div>

    <div class="orb-container" onclick="startVoice()">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="core"></div>
    </div>

    <div class="display-box" id="chatDisplay">
        <div class="message jarvis-msg"><b>JARVIS:</b> Welcome back, Boss. Neural Core with Gemini AI active. How can I assist you today?</div>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Ask Jarvis anything..." onkeypress="handleKey(event)">
        <button onclick="sendText()">SEND</button>
    </div>

    <script>
        const chatDisplay = document.getElementById('chatDisplay');
        const statusText = document.getElementById('statusText');

        function setApiKey() {
            const currentKey = localStorage.getItem('gemini_api_key') || '';
            const key = prompt("Enter your Gemini API Key from Google AI Studio:", currentKey);
            if (key !== null) {
                localStorage.setItem('gemini_api_key', key.trim());
                alert("API Key saved successfully!");
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(sender, text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-msg' : 'jarvis-msg');
            msg.innerHTML = `<b>${sender}:</b> ${text}`;
            chatDisplay.appendChild(msg);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;

            if (!isUser) speak(text);
        }

        async function fetchGeminiResponse(promptText) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                return "Boss, please tap the '🔑 API KEY' button at the top right to set your Gemini API key.";
            }

            statusText.innerText = "THINKING...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "You are JARVIS, an extremely intelligent, helpful, and concise AI assistant built for Boss. Respond in a brief, direct, and conversational manner without markdown clutter. User question: " + promptText }]
                        }]
                    })
                });

                const data = await response.json();
                statusText.innerText = "SYSTEM ONLINE // READY";
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Sorry Boss, I encountered an issue parsing the AI response.";
                }
            } catch (err) {
                statusText.innerText = "SYSTEM ONLINE // READY";
                return "Unable to connect to Gemini AI core. Please check your network or API Key.";
            }
        }

        async function processCommand(text) {
            const query = text.toLowerCase();

            // Hardware Commands (Local Execution)
            if (query.includes('torch') || query.includes('flashlight') || query.includes('light')) {
                if (query.includes('on') || query.includes('open') || query.includes('start')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(true) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned ON, Boss." : "Turning ON Flashlight, Boss.");
                    return;
                } else if (query.includes('off') || query.includes('close') || query.includes('stop')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(false) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned OFF, Boss." : "Turning OFF Flashlight, Boss.");
                    return;
                }
            } else if (query.includes('battery')) {
                let level = window.Android && window.Android.getBatteryLevel ? window.Android.getBatteryLevel() : -1;
                addMessage('JARVIS', level >= 0 ? `Your battery level is currently at ${level} percent, Boss.` : "Battery level checked.");
                return;
            } else if (query.startsWith('open ')) {
                let app = query.replace('open', '').trim();
                let launched = window.Android && window.Android.openApp ? window.Android.openApp(app) : false;
                addMessage('JARVIS', launched ? `Opening ${app}, Boss.` : `Attempting to launch ${app}, Boss.`);
                return;
            }

            // Cloud Gemini AI Execution for General Intelligence
            const aiResponse = await fetchGeminiResponse(text);
            addMessage('JARVIS', aiResponse);
        }

        function sendText() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val) {
                addMessage('YOU', val, true);
                input.value = '';
                processCommand(val);
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice Recognition not supported.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            statusText.innerText = "LISTENING...";
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                statusText.innerText = "SYSTEM ONLINE // READY";
                addMessage('YOU', text, true);
                processCommand(text);
            };
            
            recognition.onerror = function() { statusText.innerText = "SYSTEM ONLINE // READY"; };
            recognition.start();
        }
    </script>
</body>
</html>
