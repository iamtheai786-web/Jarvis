<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarvis AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050b14;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0 10px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }
        .header-title { text-align: left; }
        .title { font-size: 18px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px #00f3ff; }
        .status { font-size: 10px; color: #70a1ff; letter-spacing: 1px; }

        .header-actions { display: flex; gap: 8px; }
        .btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .orb-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 0;
        }
        .orb-container {
            position: relative;
            width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { width: 100%; height: 100%; border-top: 2px solid #00f3ff; border-bottom: 2px solid #00f3ff; animation: spin 4s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border-left: 2px solid #70a1ff; border-right: 2px solid #70a1ff; animation: spin-reverse 2.5s linear infinite; }
        .core {
            width: 50%; height: 50%;
            background: radial-gradient(circle, #00f3ff 0%, #050b14 70%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00f3ff;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        .display-box {
            flex: 1;
            width: 100%;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px; padding: 15px; overflow-y: auto;
            backdrop-filter: blur(5px); box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
            margin: 8px 0;
        }
        .message { margin-bottom: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .jarvis-msg { color: #00f3ff; }
        .user-msg { color: #eccc68; text-align: right; }

        .controls { width: 100%; display: flex; gap: 8px; }
        input.text-input {
            flex: 1; background: rgba(10, 25, 47, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 20px;
            padding: 12px 18px; color: #fff; outline: none; font-size: 14px;
        }
        button.send-btn {
            background: #00f3ff; border: none; border-radius: 20px;
            padding: 12px 20px; color: #050b14; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }

        /* IN-APP MODAL FOR API KEY */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(6px);
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #0a192f; border: 1px solid #00f3ff;
            border-radius: 16px; padding: 20px; width: 88%; max-width: 340px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); text-align: center;
        }
        .modal-card h3 { color: #00f3ff; font-size: 16px; margin-bottom: 8px; }
        .modal-card p { color: #70a1ff; font-size: 11px; margin-bottom: 15px; }
        .modal-card input {
            width: 100%; background: #050b14; border: 1px solid rgba(0, 243, 255, 0.5);
            border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 12px;
            margin-bottom: 15px; outline: none;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btns button {
            padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; border: none;
        }
        .btn-save { background: #00f3ff; color: #050b14; }
        .btn-cancel { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <div class="title">JARVIS AI</div>
            <div class="status" id="statusText">SYSTEM ONLINE // READY</div>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="openKeyModal()">🔑 KEY</button>
        </div>
    </div>

    <div class="orb-wrapper">
        <div class="orb-container" onclick="startVoice()">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="core"></div>
        </div>
    </div>

    <div class="display-box" id="chatDisplay">
        <div class="message jarvis-msg"><b>JARVIS:</b> Welcome Boss! Tap '🔑 KEY' to enter your API key, then send me any message.</div>
    </div>

    <div class="controls">
        <input type="text" class="text-input" id="userInput" placeholder="Ask Jarvis anything..." onkeypress="handleKey(event)">
        <button type="button" class="send-btn" onclick="sendText()">SEND</button>
    </div>

    <!-- API KEY IN-APP MODAL -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-card">
            <h3>SET GEMINI API KEY</h3>
            <p>Paste your API key from Google AI Studio below:</p>
            <input type="text" id="apiKeyInput" placeholder="AIzaSy..." />
            <div class="modal-btns">
                <button type="button" class="btn-save" onclick="saveApiKeyModal()">SAVE KEY</button>
                <button type="button" class="btn-cancel" onclick="closeKeyModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const chatDisplay = document.getElementById('chatDisplay');
        const statusText = document.getElementById('statusText');
        const keyModal = document.getElementById('keyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');

        function openKeyModal() {
            apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            keyModal.classList.add('active');
        }

        function closeKeyModal() {
            keyModal.classList.remove('active');
        }

        function saveApiKeyModal() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                closeKeyModal();
                addMessage('JARVIS', 'API Key saved successfully! How can I assist you today, Boss?');
            } else {
                alert('Please enter a valid API key.');
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(sender, text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-msg' : 'jarvis-msg');
            msg.innerHTML = `<b>${sender}:</b> ${text}`;
            chatDisplay.appendChild(msg);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;

            if (!isUser) speak(text);
        }

        async function fetchGeminiResponse(promptText) {
            const apiKey = localStorage.getItem('gemini_api_key') || '';
            if (!apiKey) {
                openKeyModal();
                return "Boss, please enter your Gemini API key in the popup and tap SAVE KEY.";
            }

            statusText.innerText = "THINKING...";
            const models = ['gemini-3.6-flash', 'gemini-3.1-pro-preview'];
            let lastError = "";

            for (let model of models) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: "You are JARVIS, an intelligent AI assistant. Answer Boss directly and concisely. Question: " + promptText }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        statusText.innerText = "SYSTEM ONLINE // READY";
                        return data.candidates[0].content.parts[0].text;
                    }

                    if (data.error && data.error.message) {
                        lastError = data.error.message;
                    }
                } catch (err) {
                    lastError = "Network connection failed. Please check internet.";
                }
            }

            statusText.innerText = "SYSTEM ONLINE // READY";
            return "API Error: " + (lastError || "Service unavailable.");
        }

        async function processCommand(text) {
            const query = text.toLowerCase();

            if (query.includes('torch') || query.includes('flashlight') || query.includes('light')) {
                if (query.includes('on') || query.includes('open') || query.includes('start')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(true) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned ON, Boss." : "Turning ON Flashlight, Boss.");
                    return;
                } else if (query.includes('off') || query.includes('close') || query.includes('stop')) {
                    let ok = window.Android && window.Android.setTorch ? window.Android.setTorch(false) : false;
                    addMessage('JARVIS', ok ? "Flashlight turned OFF, Boss." : "Turning OFF Flashlight, Boss.");
                    return;
                }
            } else if (query.includes('battery')) {
                let level = window.Android && window.Android.getBatteryLevel ? window.Android.getBatteryLevel() : -1;
                addMessage('JARVIS', level >= 0 ? `Your battery level is currently at ${level} percent, Boss.` : "Battery level checked.");
                return;
            } else if (query.startsWith('open ')) {
                let app = query.replace('open', '').trim();
                let launched = window.Android && window.Android.openApp ? window.Android.openApp(app) : false;
                addMessage('JARVIS', launched ? `Opening ${app}, Boss.` : `Attempting to launch ${app}, Boss.`);
                return;
            }

            const aiResponse = await fetchGeminiResponse(text);
            addMessage('JARVIS', aiResponse);
        }

        async function sendText() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val) {
                addMessage('YOU', val, true);
                input.value = '';
                await processCommand(val);
            }
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice Recognition not supported.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            statusText.innerText = "LISTENING...";
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                statusText.innerText = "SYSTEM ONLINE // READY";
                addMessage('YOU', text, true);
                processCommand(text);
            };
            
            recognition.onerror = function() { statusText.innerText = "SYSTEM ONLINE // READY"; };
            recognition.start();
        }
    </script>
</body>
</html>
